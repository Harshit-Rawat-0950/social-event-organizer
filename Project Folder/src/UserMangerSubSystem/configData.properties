# Application details
app.name=Event Management System
app.version=1.0
app.mode=dev
app.language=English
app.devStartupDelayMs=5000
app.delay=500
app.registerDelayMs=1500
# Login settings
login.maxAttempts=3
login.sessionTimeout=30
login.defaultRole=user

# File storage paths
Files.users=Files/Users.txt
Files.events=Files/events.txt
Files.invites=Files/invite.txt
Files.friends=Files/friends.txt
Files.follow=Files/follow.txt
Files.password=Files/password.txt
Files.userData=Files/userData.txt
Files.notification=Files/notification.txt
Files.rsvp=Files/rsvp.txt

# Page text, one element per line: content,style,newLine,devMode
Files.mainpage=Files/UI/mainpage.txt
Files.eventpage=Files/UI/eventpage.txt
Files.invitepage=Files/UI/invitepage.txt
Files.notificationpage=Files/UI/notificationpage.txt
Files.reportpage=Files/UI/reportpage.txt
Files.friendpage=Files/UI/friendpage.txt
Files.profilepage=Files/UI/profilepage.txt

# Event settings
event.defaultType=Public
event.defaultCategory=General
event.maxCapacity=500
event.bookingCutoffHours=24
event.allowCancellation=true

# Terminal look. theme: neon, amber or ocean. color and unicode: auto, on or off.
ui.theme=neon
ui.color=auto
ui.unicode=auto
ui.width=78
